<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>
<body>
  <nav>
   <div class="dayandtime">
    <h1 class="day">Day</h1>
    <h3 class="time">time</h3>
   </div>
   <h1 id="heading">WeatherSkycast</h1>
  
   <div class="toggle" id="darkmode">
    <i class="ri-moon-fill"></i>
    <i class="ri-sun-fill"></i>
    </div>
    </nav> 
    <main>
  <div class="card">
    <div class="cardelements">
    <div class="input">
      <input class="inputtype" type="text" placeholder="Enter the city">
      <i class="ri-search-2-line"></i>
    </div>
    <div class="weatherdetails">
      <img class="image" src="sunnyimage.png" alt="">
      <h1 class="Temperature">30°C</h1>
      <h2 class="City">Banglore</h2>
    </div>
    <div class="extradetails">
      <div class="humiditydetail">
        <img src="humidityimage.png" alt="">
        <div class="humidity">
          <h3 class="humidity-label">humidity</h3>
           <h3 class="humidity-value">30%</h3>
        </div>
       
      </div>
      <div class="windspeeddetail">
        <img src="windspeedimage.png" alt="">
        <div class="windspeed">
          <h3 class="windspeed-label">windspeed</h3>
          <h3 class="windspeed-value">30 km/h</h3>
        </div>
        
      </div>
    </div>
    </div>
  </div>
  </main>
  <div class="news">
 <div class="mininews">
  <div class="cards">
  <h1>Weather Alert</h1>
  <div class="card-content">
    <h3 class="card-title"></h3>
    <p class="card-subtitle"></p>
  </div>
  </div>
 <div class="cards">
  <h1>A.Q.I</h1>
  <div class="card-content">
    <h3>Air Quality</h3>
    <h4 class="aqitext"></h4>
  </div>
  </div>
 
 </div>

  </div>

  <script src="javascript.js"></script>
</body>
</html>
